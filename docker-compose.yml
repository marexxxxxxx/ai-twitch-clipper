services:
  clipper:
    build:
      context: .
      dockerfile: Dockerfile
    image: ai-twitch-clipper:latest
    container_name: ai-twitch-clipper
    restart: unless-stopped
    # Supervisor lässt laufende Zusammenbauten bis zu 90 s auslaufen.
    stop_grace_period: 120s
    # 40 Streams = bis zu 80 Kindprozesse (streamlink + ffmpeg) plus Sockets.
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    # Ressourcen-Empfehlung für 40 gleichzeitige 720p60-Streams.
    # Bewusst nicht aktiv: Der Host hat nur 10 GB RAM, aktiviert würde Docker
    # bei knappem Speicher hart eingreifen. Auf einem größeren Host einkommentieren:
    # mem_limit: 8g
    # cpus: 4.0
    ports:
      - "${PORT:-8000}:8000"
    volumes:
      - "${HOST_CLIPS_DIR:-./clips}:/data"
    environment:
      STORAGE_ROOT: /data
      DATA_DIR: /data
      PORT: "8000"
      TZ: "${TZ:-Europe/Berlin}"
      LOG_LEVEL: "${LOG_LEVEL:-INFO}"
      QUALITY: "${QUALITY:-720p60,best}"
      TWITCH_CLIENT_ID: "${TWITCH_CLIENT_ID:-}"
      TWITCH_CLIENT_SECRET: "${TWITCH_CLIENT_SECRET:-}"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import sys,urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3).status == 200 else 1)"
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 20s
